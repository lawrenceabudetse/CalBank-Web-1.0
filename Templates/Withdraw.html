{% extends 'base.html' %}
{% block title %}WITHDRAWAL{% endblock %}
{% block content%}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form action="/withdraw" method="POST">
  <div class="form-group">
    <label for="amount">Amount:</label>
    <input type="text" id="amount" name="amount" placeholder="Enter Amount To Withdraw" required autocomplete="on">
  </div>
  <button type="submit" class="submit-btn">Withdraw</button>
</form>
</div>
{% endblock %}
